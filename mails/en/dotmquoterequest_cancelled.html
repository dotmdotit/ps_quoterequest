<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your quote has been cancelled</title></head>
<body style="margin:0;padding:0;background:#F4F4F4;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.5;color:#222222;">
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F4F4F4;"><tr><td align="center" style="padding:24px 12px;">

</td></tr>
<tr><td style="padding:20px 28px 28px;color:#666666;font-size:13px;"><a href="{shop_url}" style="color:{dqr_color};font-weight:bold;text-decoration:none;">{shop_name}</a></td></tr>
</table></td></tr></table></body></html>
